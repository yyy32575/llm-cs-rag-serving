# llamafactory-cli train configs/llamafactory_dpo.yaml
model_name_or_path: Qwen/Qwen3-8B
adapter_name_or_path: outputs/lf_sft_qlora_r16
trust_remote_code: true
stage: dpo
do_train: true
finetuning_type: lora
lora_rank: 16
lora_target: q_proj,v_proj
quantization_bit: 4
pref_beta: 0.1
pref_loss: sigmoid
dataset_dir: data
dataset: ecs_dpo
template: qwen3
enable_thinking: false
cutoff_len: 1024
output_dir: outputs/lf_dpo_beta0.1
logging_steps: 10
save_strategy: epoch
plot_loss: true
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 5.0e-6
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
